[package]
name = "aether"
version = "2.0.0"
edition = "2021"
description = "Aether — Native System, Silicon & Network Cockpit in Rust"
license = "MIT"
authors = ["Abdullah Bin Madhi"]
readme = "README.md"
repository = "https://github.com/abdullah-binmadhi/AETHER"

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
netdev = "0.47.0"
objc2 = "0.6.5"
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
socket2 = "0.6.5"
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[lints.rust]
# unsafe is confined to the CoreWLAN FFI module, which re-allows it locally.
unsafe_code = "deny"
